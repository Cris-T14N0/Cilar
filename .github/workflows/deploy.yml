kind: pipeline
type: docker
name: deploy

steps:
  - name: Checkout code
    image: alpine/git
    commands:
      - git clone https://github.com/your-username/your-repo.git .
      - git checkout Main

  - name: Deploy via SCP/SFTP
    image: appleboy/drone-scp
    settings:
      host:
        from_secret: FTP_SERVER   # e.g., your OVH host
      username:
        from_secret: FTP_USERNAME
      password:
        from_secret: FTP_PASSWORD
      port: 22
      target: "C:/www"           # Windows destination folder
      source: "./*"               # copy all files individually
      rm: true                    # remove existing files before upload
      exclude:
        - ".git/**"
        - ".github/**"
        - ".gitignore"
        - "README.md"
        - ".env"
        - ".DS_Store"
