name: Deploy to OVH via SFTP

on:
  push:
    branches:
      - Main  # Default branch

jobs:
  deploy:
    name: Deploy to OVH via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v4

      - name: 📤 Deploy via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}      # e.g., ftp.cluster100.hosting.ovh.net
          username: ${{ secrets.FTP_USERNAME }} # e.g., lojacip
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "./"                          # Root folder of your repo
          target: "/www"
          rm: true                              # Remove existing files in target folder
          exclude: |
            .git/**
            .github/**
            .gitignore
            README.md
            .env
            .DS_Store
