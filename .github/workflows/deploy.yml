name: Deploy to OVH via SFTP

on:
  push:
    branches:
      - Main   # ou a branch que usas

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Deploy para OVH via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.cluster100.hosting.ovh.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 22
          local-dir: ./ # pasta local do repositório
          server-dir: /home/lojacip/ # pasta do alojamento OVH
