name: Deploy to OVH via FTP

on:
  push:
    branches:
      - Main  # Default branch

jobs:
  deploy:
    name: Deploy to OVH SFTP
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v4

      - name: 📤 Deploy to OVH via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}  # e.g., ftp.cluster100.hosting.ovh.net
          username: ${{ secrets.FTP_USERNAME }}  # e.g., lojacip
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: sftp
          local-dir: ./  # root folder of your repo containing HTML/CSS
          server-dir: /www
          exclude: |
            **/.git/**
            **/.github/**
            **/.gitignore
            **/README.md
            **/.env
