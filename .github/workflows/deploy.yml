kind: pipeline
type: docker
name: deploy

steps:
  - name: Checkout code
    image: alpine/git
    commands:
      - git clone https://github.com/your-username/your-repo.git .
      - git checkout Main

  - name: Deploy via SFTP
    image: appleboy/drone-scp
    settings:
      host:
        from_secret: FTP_SERVER
      username:
        from_secret: FTP_USERNAME
      password:
        from_secret: FTP_PASSWORD
      port: 22
      source: "./*"              # copy all files individually
      target: "/home/lojacip/www" # OVH Linux public folder
      rm: true                   # remove old files before upload
      overwrite: true            # overwrite existing files
