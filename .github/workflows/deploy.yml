name: Deploy to OVH via SFTP

on:
  push:
    branches:
      - Main  # Default branch

jobs:
  deploy:
    name: Deploy to OVH SFTP
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v4

      - name: 📤 Deploy via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "./"                  # root folder of your repo containing HTML/CSS
          target: "/home/lojacip/www"   # correct OVH Cloud public folder
          rm: true                      # remove existing files in target folder
          exclude: |
            .git/**
            .github/**
            .gitignore
            README.md
            .env
            .DS_Store
