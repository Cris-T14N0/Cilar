name: Deploy to OVH via SFTP

on:
  push:
    branches:
      - Main  # your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 📤 Deploy via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}       # e.g., ftp.cluster100.hosting.ovh.net
          username: ${{ secrets.FTP_USERNAME }} # e.g., lojacip
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "./"                          # all files in repo root
          target: "/home/lojacip/www"           # OVH public folder
          rm: true                               # remove existing files before upload
          strip_components: 0                    # keep folder structure as is
          overwrite: true                        # overwrite files if they exist
