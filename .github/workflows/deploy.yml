name: Deploy to OVH via SFTP

on:
  push:
    branches:
      - Main  # your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}       # your OVH server host
          username: ${{ secrets.FTP_USERNAME }} # lojacip
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "./"                          # your repo root (HTML/CSS)
          target: "/home/lojacip/www"           # OVH public folder
          rm: true                               # remove old files before upload
          overwrite: true                        # overwrite files if they exist
          strip_components: 0                    # keep folder structure
